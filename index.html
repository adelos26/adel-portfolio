<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adel Fitoussi – Coming Soon</title>

  <!-- The Martian Mono font from Google Fonts (all weights from 100 to 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="coming-soon">

    <!-- Top: the name -->
    <h1 class="site-name">Adel Fitoussi</h1>

    <!-- Middle: two eyes (decorative, so alt is empty) -->
    <div class="eyes">
      <div class="eye">
        <img class="eye-shape" src="images/eye.svg" alt="">
        <img class="eye-pupil" src="images/pupil.svg" alt="">
      </div>
      <div class="eye">
        <img class="eye-shape" src="images/eye.svg" alt="">
        <img class="eye-pupil" src="images/pupil.svg" alt="">
      </div>
    </div>

    <!-- Bottom: the sentence. Each "o" gets lighter, like in Figma -->
    <p class="coming-soon-text">
      Coming So<span class="fade fade-1">o</span><span class="fade fade-2">o</span><span class="fade fade-3">o</span><span class="fade fade-4">o</span><span class="fade fade-5">o</span><span class="fade fade-6">n</span>
    </p>

  </main>

</body>
</html>
