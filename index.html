<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adel Fitoussi</title>

  <!-- The loading screen shows only on the first page of a visit -->
  <script>
    try {
      if (sessionStorage.getItem("seen-loader")) document.documentElement.classList.add("no-loader");
      else document.documentElement.classList.add("is-loading");
      // Arriving through the menu: start covered in cream right away, before anything is drawn
      if (sessionStorage.getItem("arriving") === "yes") document.documentElement.classList.add("is-arriving");
    } catch (error) {
      document.documentElement.classList.add("is-loading");
    }
  </script>

  <!-- Stand-in font, for computers that don't have Ratzif22 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@200;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page has-site-cursor">

  <!-- Loading screen: "loading..." with the menu's hover animation -->
  <div class="loader" role="status" aria-label="loading"><div class="loader-button" aria-hidden="true"></div></div>

  <!-- The menu. The sizes and places of these buttons are fixed (see CLAUDE.md).
       --left and --width are in Figma pixels: desktop, then tablet, then phone. -->
  <header>
    <!-- On hover the box opens and shows the rest of the sentence -->
    <a class="nav-logo" href="about.html" aria-label="Hi I’m Adel"><span aria-hidden="true"><span class="logo-letter" style="--letter: 0">H</span><span class="logo-letter" style="--letter: 1">i</span><span class="nav-logo-more"><span class="logo-letter" style="--letter: 2"> </span><span class="logo-letter" style="--letter: 3">I</span><span class="logo-letter" style="--letter: 4">’</span><span class="logo-letter" style="--letter: 5">m</span><span class="logo-letter" style="--letter: 6"> </span><span class="logo-letter" style="--letter: 7">A</span><span class="logo-letter" style="--letter: 8">d</span><span class="logo-letter" style="--letter: 9">e</span><span class="logo-letter" style="--letter: 10">l</span></span></span></a>
    <nav>
      <a class="nav-button nav-button-current" aria-current="page" style="--left: 523; --width: 111; --left-tablet: 247; --width-tablet: 88; --left-phone: 131; --width-phone: 62; --order: 0; --page-color: var(--color-page-home)" href="index.html" aria-label="Home">
        <span class="nav-button-letters" aria-hidden="true"><span class="nav-letter" style="--letter: 0">H</span><span class="nav-letter" style="--letter: 1">o</span><span class="nav-letter" style="--letter: 2">m</span><span class="nav-letter" style="--letter: 3">e</span></span>
      </a>
      <a class="nav-button" style="--left: 681; --width: 111; --left-tablet: 351; --width-tablet: 100; --left-phone: 201; --width-phone: 76; --order: 1; --page-color: var(--color-page-projects)" href="projects.html" aria-label="Projects">
        <span class="nav-button-letters" aria-hidden="true"><span class="nav-letter" style="--letter: 0">P</span><span class="nav-letter" style="--letter: 1">r</span><span class="nav-letter" style="--letter: 2">o</span><span class="nav-letter" style="--letter: 3">j</span><span class="nav-letter" style="--letter: 4">e</span><span class="nav-letter" style="--letter: 5">c</span><span class="nav-letter" style="--letter: 6">t</span><span class="nav-letter" style="--letter: 7">s</span></span>
      </a>
      <a class="nav-button" style="--left: 823; --width: 135; --left-tablet: 467; --width-tablet: 120; --left-phone: 285; --width-phone: 89; --order: 2; --page-color: var(--color-page-reach-out)" href="reach-out.html" aria-label="Reach Out">
        <span class="nav-button-letters" aria-hidden="true"><span class="nav-letter" style="--letter: 0">R</span><span class="nav-letter" style="--letter: 1">e</span><span class="nav-letter" style="--letter: 2">a</span><span class="nav-letter" style="--letter: 3">c</span><span class="nav-letter" style="--letter: 4">h</span><span class="nav-letter" style="--letter: 5"> </span><span class="nav-letter" style="--letter: 6">O</span><span class="nav-letter" style="--letter: 7">u</span><span class="nav-letter" style="--letter: 8">t</span></span>
      </a>
    </nav>
  </header>

  <main class="home-main">
    <!-- Each line rises out of its own mask. The line breaks are the same as in Figma.
         statement-wave.js splits the lines into letters for the wave on hover. -->
    <h1 class="statement">
      <span class="statement-mask">
        <span class="statement-line" style="--order: 0">I’m A Motion Designer,</span>
      </span>
      <span class="statement-mask">
        <span class="statement-line" style="--order: 1">Storyteller, Creative</span>
      </span>
      <span class="statement-mask">
        <span class="statement-line" style="--order: 2">Thinker And A Cat Lover.</span>
      </span>
    </h1>

    <!-- The title of the strip of shorts. Its letters jump in a wave on hover, like the sentence (statement-wave.js). -->
    <h2 class="shorts-title"><span class="statement-line">Snack-Sized Motion and other stuff I made for fun:</span></h2>

    <!-- Short works on a moving strip (on phone and tablet: between the sentence and the character).
         Clicking one opens it full screen, like a story.
         To add a short: put the video in videos/shorts and a still in images/shorts, and add a line here.
         --ratio is the video's shape: width / height. -->
    <section class="shorts" aria-label="Short works">
      <ul class="shorts-track">
        <li><button class="short" type="button" style="--ratio: 1 / 1" data-cursor-label="Watch It" aria-label="Watch: Dolls"><video src="videos/shorts/dolls.mp4" poster="images/shorts/dolls.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
        <li><button class="short" type="button" style="--ratio: 16 / 9" data-cursor-label="Watch It" aria-label="Watch: Op-Doc"><video src="videos/opdoc-preview.mp4" poster="images/projects/opdoc-still.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
        <li><button class="short" type="button" style="--ratio: 4 / 5" data-cursor-label="Watch It" aria-label="Watch: The New Yorker"><video src="videos/shorts/adel-fitoussi.mp4" poster="images/shorts/adel-fitoussi.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
        <li><button class="short" type="button" style="--ratio: 16 / 9" data-cursor-label="Watch It" aria-label="Watch: Title Sequence"><video src="videos/title-preview.mp4" poster="images/projects/title-still.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
        <li><button class="short" type="button" style="--ratio: 16 / 9" data-cursor-label="Watch It" aria-label="Watch: 5 Seconds"><video src="videos/shorts/five-seconds.mp4" poster="images/shorts/five-seconds.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
        <li><button class="short" type="button" style="--ratio: 16 / 9" data-cursor-label="Watch It" aria-label="Watch: Virtual Wandering"><video src="videos/wander-preview.mp4" poster="images/projects/wander-still.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
        <li><button class="short" type="button" style="--ratio: 16 / 9" data-cursor-label="Watch It" aria-label="Watch: The Siren’s Song"><video src="videos/siren-preview.mp4" poster="images/projects/siren-still.jpg" muted loop playsinline autoplay preload="metadata"></video></button></li>
      </ul>
    </section>

    <!-- The red character. character.js draws the eyes and makes them move. -->
    <div class="character" aria-hidden="true"><div class="eye-pair"></div></div>
  </main>

  <!-- A short, open full screen, like a story (stories.js fills it) -->
  <div class="story-viewer" role="dialog" aria-modal="true" aria-label="Short works" inert>
    <div class="story-frame">
      <div class="story-bars"></div>
      <video class="story-video" playsinline></video>
      <button class="story-tap is-back" type="button" aria-label="Previous"></button>
      <button class="story-tap is-next" type="button" aria-label="Next"></button>
      <button class="story-close" type="button" aria-label="Close">×</button>
    </div>
  </div>

  <!-- The custom cursor (computer only) -->
  <div class="site-cursor" aria-hidden="true"><span class="cursor-label"></span></div>

  <!-- The moving strip of shorts, and opening one full screen (before site.js, so the copies get the cursor word too) -->
  <script src="stories.js"></script>
  <!-- Loading screen and cursor -->
  <script src="site.js"></script>
  <!-- Menu buttons and the page transition -->
  <script src="nav-buttons.js"></script>
  <!-- Makes the letters of the sentence wave on hover -->
  <script src="statement-wave.js"></script>
  <!-- The red character's eyes -->
  <script src="character.js"></script>

</body>
</html>
