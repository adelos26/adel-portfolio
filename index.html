<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adel Fitoussi – Coming Soon</title>

  <!-- The Martian Mono font from Google Fonts (all weights from 100 to 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="coming-soon">

    <!-- Top: the name. Each letter is in its own <span class="letter"> so it can turn on hover. -->
    <h1 class="site-name">
      <span class="letter">A</span><span class="letter">d</span><span class="letter">e</span><span class="letter">l</span>
      <span class="letter">F</span><span class="letter">i</span><span class="letter">t</span><span class="letter">o</span><span class="letter">u</span><span class="letter">s</span><span class="letter">s</span><span class="letter">i</span>
    </h1>

    <!-- Middle: two eyes (decorative, so alt is empty).
         "eye-inside" hides any part of the pupil that moves outside the eye shape. -->
    <div class="eyes">
      <div class="eye">
        <img class="eye-shape" src="images/eye.svg" alt="">
        <div class="eye-inside">
          <img class="eye-pupil" src="images/pupil.svg" alt="">
        </div>
      </div>
      <div class="eye">
        <img class="eye-shape" src="images/eye.svg" alt="">
        <div class="eye-inside">
          <img class="eye-pupil" src="images/pupil.svg" alt="">
        </div>
      </div>
    </div>

    <!-- Bottom: the sentence.
         Each letter is in its own <span class="letter"> so it can turn on hover.
         The "fade" letters get thinner one after another, like in Figma. -->
    <p class="coming-soon-text">
      <span class="letter">C</span><span class="letter">o</span><span class="letter">m</span><span class="letter">i</span><span class="letter">n</span><span class="letter">g</span>
      <span class="letter">S</span><span class="letter">o</span><span class="letter fade fade-1">o</span><span class="letter fade fade-2">o</span><span class="letter fade fade-3">o</span><span class="letter fade fade-4">o</span><span class="letter fade fade-5">o</span><span class="letter fade fade-6">n</span>
    </p>

  </main>

  <!-- Makes the pupils follow the mouse / finger -->
  <script src="script.js"></script>

</body>
</html>
